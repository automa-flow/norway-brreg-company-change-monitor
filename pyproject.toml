[project]
name = "norway-brreg-company-change-monitor"
version = "0.1.0"
description = "Apify Actor that monitors Norwegian companies in BRREG Enhetsregisteret and reports typed changes."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "apify~=4.0",
    "httpx>=0.28,<0.29",
    "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.5",
    "mypy==2.3.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = [".", "src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --import-mode=importlib"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "ASYNC", "BLE", "DTZ", "PLC0415", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src", "common"]
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
